<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naomi | Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <style>
    /* Elegant Pastel Chic Palette */
    :root {
      --bg-cream: #fdfbf7;
      --pastel-pink: #ffe6eb;
      --main-pink: #ffb8c6;
      --accent-yellow: #fff3be;
      --text-dark: #3a2e30;
      --text-muted: #706062;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-cream);
      background-image:
        linear-gradient(rgba(255, 184, 198, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 184, 198, 0.07) 1px, transparent 1px);
      background-size: 40px 40px;
      color: var(--text-dark);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    #spotlight {
      position: fixed;
      top: 0;
      left: 0;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(255, 184, 198, 0.3) 0%, transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1;
      transition: opacity 0.4s ease;
    }

    .ripple {
      position: fixed;
      border: 2px solid rgba(255, 184, 198, 0.4);
      border-radius: 50%;
      pointer-events: none;
      animation: ripple-out 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      z-index: 9999;
    }

    @keyframes ripple-out {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    header {
      width: 100%;
      padding: 30px 40px 0 40px;
      position: relative;
      z-index: 10;
    }

    nav {
      max-width: 1140px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.6);
      padding: 16px 40px;
      border-radius: 50px;
      border: 1px solid rgba(255, 184, 198, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .logo {
      font-family: 'Comfortaa', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--text-dark);
    }

    .nav-links {
      display: flex;
      gap: 35px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-family: 'Comfortaa', sans-serif;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--main-pink);
    }

    main {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 40px;
      position: relative;
      z-index: 2;
    }

    .hero {
      padding: 120px 0 80px 0;
      max-width: 750px;
    }

    .hero h1 {
      font-family: 'Comfortaa', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 25px;
    }

    .highlight {
      background: linear-gradient(120deg, var(--pastel-pink) 0%, var(--accent-yellow) 100%);
      padding: 4px 12px;
      border-radius: 12px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .btn-primary {
      display: inline-block;
      background-color: var(--text-dark);
      color: #ffffff;
      text-decoration: none;
      font-family: 'Comfortaa', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 16px 36px;
      border-radius: 50px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(58, 46, 48, 0.1);
      cursor: pointer;
      border: none;
    }

    .btn-primary:hover {
      background-color: var(--main-pink);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 184, 198, 0.4);
    }

    .capabilities-ribbon {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      margin-bottom: 100px;
    }

    .capability-card {
      background: #ffffff;
      border: 1px solid rgba(255, 184, 198, 0.3);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(58, 46, 48, 0.02);
    }

    .capability-card .num {
      font-family: 'Comfortaa', sans-serif;
      font-size: 0.9rem;
      color: var(--main-pink);
      margin-bottom: 15px;
      display: block;
    }

    .capability-card h3 {
      font-family: 'Comfortaa', sans-serif;
      font-size: 1.15rem;
      margin-bottom: 10px;
    }

    .capability-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    #projects {
      padding-bottom: 80px;
    }

    #projects h2 {
      font-family: 'Comfortaa', sans-serif;
      font-size: 2.2rem;
      margin-bottom: 45px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 35px;
    }

    .project-card {
      background: #ffffff;
      border: 1px solid rgba(255, 184, 198, 0.4);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(58, 46, 48, 0.02);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .project-card:hover {
